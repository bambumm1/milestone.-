<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F5F0">

<title>Milestone</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Milestone">

<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #F7F5F0;
  --card: #FBFAF7;
  --soft: #EEEAE4;
  --text: #111111;
  --muted: #77736D;
  --line: #D1CCC5;
  --inverse: #111111;
  --inverseText: #FFFFFF;
  --shadow: 0 12px 30px rgba(0,0,0,.06);
}

html[data-theme="dark"] {
  --bg: #050505;
  --card: #0B0B0B;
  --soft: #141414;
  --text: #F4F1EC;
  --muted: #9F9991;
  --line: #393633;
  --inverse: #F4F1EC;
  --inverseText: #111111;
  --shadow: 0 12px 30px rgba(0,0,0,.35);
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

.app {
  width: min(100%, 540px);
  min-height: 100vh;
  margin: auto;

  padding:
    calc(env(safe-area-inset-top) + 24px)
    20px
    120px;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

/* HEADER */

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 36px;
}

.icon-btn {
  border: 0;
  background: transparent;
  padding: 6px;
  font-size: 24px;
}

.header {
  padding-top: 20px;
}

.greeting {
  font-family: Georgia, serif;
  font-size: 22px;
}

.name {
  margin-top: 2px;
  font-family: Georgia, serif;
  font-size: 52px;
  line-height: .96;
  letter-spacing: -2px;
}

.tagline {
  margin-top: 14px;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 2.3px;
  text-transform: uppercase;
}

/* THEME */

.theme-switch {
  width: 250px;
  margin: 28px 0 24px;
  padding: 4px;

  border: 1px solid var(--line);
  border-radius: 999px;

  background: var(--soft);

  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
}

.theme-btn {
  border: 0;
  border-radius: 999px;
  padding: 10px;

  background: transparent;
  color: var(--muted);
}

.theme-btn.active {
  background: var(--inverse);
  color: var(--inverseText);
}

/* CATEGORIES */

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.category-card {
  height: 168px;

  border: 1px solid var(--line);
  border-radius: 24px;

  background: var(--card);
  color: var(--text);

  box-shadow: var(--shadow);

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  transition: transform .15s ease;
}

.category-card:active {
  transform: scale(.98);
}

.category-icon {
  margin-bottom: 14px;
  font-size: 28px;
}

.category-title {
  font-family: Georgia, serif;
  font-size: 28px;
}

.category-count {
  margin-top: 9px;

  color: var(--muted);

  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

/* PROGRESS */

.progress-card {
  margin-top: 18px;
  min-height: 104px;

  border: 1px solid var(--line);
  border-radius: 24px;

  background: var(--card);

  box-shadow: var(--shadow);

  display: flex;
  align-items: center;

  padding: 18px;
}

.progress-icon {
  width: 76px;

  margin-right: 20px;
  border-right: 1px solid var(--line);

  font-size: 26px;
  text-align: center;
}

.progress-label {
  font-family: Georgia, serif;
  font-size: 14px;
}

.progress-number {
  margin: 4px 0;

  font-family: Georgia, serif;
  font-size: 24px;
}

.progress-small {
  color: var(--muted);
  font-size: 12px;
}

/* SECTION */

.section-head {
  margin: 30px 0 12px;
}

.section-title {
  font-family: Georgia, serif;
  font-size: 25px;
}

/* LIST */

.recent-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.recent-item {
  display: flex;
  align-items: center;
  gap: 12px;

  padding: 9px;

  border: 1px solid var(--line);
  border-radius: 16px;

  background: var(--card);

  box-shadow: var(--shadow);
}

.recent-thumb,
.item-thumb {
  width: 58px;
  height: 58px;

  border-radius: 12px;

  object-fit: cover;

  background: var(--soft);

  flex: none;
}

.placeholder {
  width: 58px;
  height: 58px;

  border: 1px solid var(--line);
  border-radius: 12px;

  background: var(--soft);

  display: grid;
  place-items: center;

  color: var(--muted);

  flex: none;
}

.recent-main,
.item-main {
  min-width: 0;
  flex: 1;
}

.recent-title,
.item-title {
  font-family: Georgia, serif;
  font-size: 16px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.recent-meta,
.item-note {
  margin-top: 4px;

  color: var(--muted);
  font-size: 11px;
}

.item-note {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.check {
  width: 26px;
  height: 26px;

  border: 1px solid var(--line);
  border-radius: 50%;

  background: transparent;

  display: grid;
  place-items: center;

  flex: none;
}

.check.done {
  border-color: var(--inverse);

  background: var(--inverse);
  color: var(--inverseText);
}

.delete-btn {
  width: 32px;
  height: 32px;

  border: 0;

  background: transparent;

  color: var(--muted);

  font-size: 20px;
}

.empty {
  min-height: 110px;

  padding: 20px;

  border: 1px solid var(--line);
  border-radius: 16px;

  background: var(--card);

  color: var(--muted);

  display: grid;
  place-items: center;

  text-align: center;
}

/* CATEGORY */

.category-top {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 28px;
}

.category-top-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.category-screen-title {
  font-family: Georgia, serif;
  font-size: 32px;
}

.filters {
  display: grid;
  grid-template-columns: repeat(3,1fr);

  gap: 8px;

  margin-bottom: 20px;
}

.filter {
  border: 1px solid var(--line);
  border-radius: 999px;

  padding: 10px 6px;

  background: transparent;
}

.filter.active {
  border-color: var(--inverse);

  background: var(--inverse);
  color: var(--inverseText);
}

.item {
  display: flex;
  align-items: center;

  gap: 12px;

  padding: 9px 0;

  border-bottom: 1px solid var(--line);
}

/* PROFILE */

.profile-head {
  display: flex;
  align-items: center;

  gap: 15px;

  margin: 18px 0 26px;
}

.avatar {
  width: 68px;
  height: 68px;

  border: 1px solid var(--line);
  border-radius: 50%;

  object-fit: cover;
}

.profile-name {
  font-family: Georgia, serif;
  font-size: 29px;
}

.profile-sub {
  margin-top: 5px;

  color: var(--muted);

  font-size: 12px;
  line-height: 1.5;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3,1fr);
}

.stat {
  text-align: center;
  border-right: 1px solid var(--line);
}

.stat:last-child {
  border-right: 0;
}

.stat-num {
  font-family: Georgia, serif;
  font-size: 24px;
}

.stat-label {
  margin-top: 4px;

  color: var(--muted);
  font-size: 10px;
}

/* NAV */

.bottom-nav {
  position: fixed;

  left: 50%;
  bottom: 0;

  transform: translateX(-50%);

  width: min(540px,100%);

  min-height: 84px;

  padding:
    10px
    34px
    calc(14px + env(safe-area-inset-bottom));

  border-top: 1px solid var(--line);

  background: rgba(247,245,240,.92);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  display: flex;
  align-items: center;
  justify-content: space-between;

  z-index: 20;
}

html[data-theme="dark"] .bottom-nav {
  background: rgba(5,5,5,.92);
}

.nav-btn {
  min-width: 60px;

  border: 0;

  background: transparent;

  font-size: 12px;
}

.nav-symbol {
  display: block;

  margin-bottom: 5px;

  font-size: 20px;
}

.add-main {
  width: 58px;
  height: 58px;

  border: 1px solid var(--text);
  border-radius: 50%;

  background: var(--inverse);
  color: var(--inverseText);

  font-size: 32px;
}

/* MODAL */

.modal {
  display: none;

  position: fixed;

  inset: 0;

  z-index: 50;

  background: rgba(0,0,0,.45);

  align-items: flex-end;
}

.modal.active {
  display: flex;
}

.sheet {
  width: min(540px,100%);

  max-height: 92vh;

  overflow: auto;

  margin: 0 auto;

  padding:
    22px
    20px
    calc(28px + env(safe-area-inset-bottom));

  border-radius: 26px 26px 0 0;

  background: var(--bg);
}

.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 20px;
}

.sheet-title {
  font-family: Georgia, serif;
  font-size: 23px;
}

.text-btn {
  border: 0;

  background: transparent;

  padding: 5px 0;
}

.auto-photo {
  min-height: 88px;

  margin-bottom: 16px;

  padding: 12px;

  border: 1px dashed var(--line);
  border-radius: 14px;

  display: flex;
  align-items: center;

  gap: 13px;
}

.auto-preview {
  display: none;

  width: 62px;
  height: 62px;

  border-radius: 10px;

  object-fit: cover;
}

.auto-preview.visible {
  display: block;
}

.auto-copy {
  color: var(--muted);

  font-size: 12px;
  line-height: 1.45;
}

.field {
  margin-bottom: 13px;
}

.label {
  margin-bottom: 6px;

  color: var(--muted);

  font-size: 11px;
}

input,
select,
textarea {
  width: 100%;

  padding: 13px;

  border: 1px solid var(--line);
  border-radius: 11px;

  outline: none;

  background: var(--card);
  color: var(--text);
}

textarea {
  min-height: 85px;

  resize: none;
}

.save-btn {
  width: 100%;

  margin-top: 5px;

  padding: 14px;

  border: 0;
  border-radius: 12px;

  background: var(--inverse);
  color: var(--inverseText);

  font-weight: 600;
}
</style>
</head>

<script>

/* ==============================
   DATA
============================== */

let items =
JSON.parse(
  localStorage.getItem("milestones")
) || [];

items =
items.map(
  (item,index)=>({

    id:
      item.id ||
      Date.now()+index,

    title:
      item.title ||
      "Untitled",

    type:
      item.type ||
      item.category ||
      "Want",

    done:
      Boolean(
        item.done ||
        item.completed
      ),

    notes:
      item.notes || "",

    date:
      item.date || "",

    link:
      item.link || "",

    image:
      item.image || ""

  })
);

let currentCategory = "Want";
let currentFilter = "all";

let previewTimer = null;
let previewImage = "";

const searchingImages = new Set();

const categoryNames = {

  Want: "Items",
  Go: "Places",
  Do: "Activities",
  Watch: "Movies"

};

const labels = {

  Want:{
    open:"To Buy",
    done:"Bought"
  },

  Go:{
    open:"To Go",
    done:"Visited"
  },

  Do:{
    open:"To Do",
    done:"Done"
  },

  Watch:{
    open:"To Watch",
    done:"Watched"
  }

};

/* ==============================
   SAVE
============================== */

function saveItems(){

  localStorage.setItem(
    "milestones",
    JSON.stringify(items)
  );

}

/* ==============================
   SAFE HTML
============================== */

function escapeHtml(text){

  return String(text)
  .replace(
    /[&<>"']/g,
    character=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[character])
  );

}

/* ==============================
   THEME
============================== */

function applySavedTheme(){

  const saved =
  localStorage.getItem(
    "milestoneTheme"
  );

  setTheme(
    saved === "dark"
    ? "dark"
    : "light",
    false
  );

}

function setTheme(
  theme,
  save=true
){

  document
  .documentElement
  .setAttribute(
    "data-theme",
    theme
  );

  document
  .getElementById(
    "lightBtn"
  )
  .classList
  .toggle(
    "active",
    theme === "light"
  );

  document
  .getElementById(
    "darkBtn"
  )
  .classList
  .toggle(
    "active",
    theme === "dark"
  );

  const meta =
  document.querySelector(
    'meta[name="theme-color"]'
  );

  if(meta){

    meta.setAttribute(
      "content",
      theme === "dark"
      ? "#050505"
      : "#F7F5F0"
    );

  }

  if(save){

    localStorage.setItem(
      "milestoneTheme",
      theme
    );

  }

}

/* ==============================
   IMAGE QUERY
============================== */

function imageQuery(
  title,
  category
){

  if(category === "Want"){

    return `${title} product`;

  }

  if(category === "Go"){

    return `${title} travel destination`;

  }

  if(category === "Do"){

    return `${title} activity`;

  }

  if(category === "Watch"){

    return `${title} movie film poster`;

  }

  return title;

}

/* ==============================
   DUCKDUCKGO
============================== */

async function searchDuckDuckGo(
  title,
  category
){

  try{

    const query =
    imageQuery(
      title,
      category
    );

    const url =
      "https://api.duckduckgo.com/?" +
      "q=" +
      encodeURIComponent(query) +
      "&format=json" +
      "&no_html=1" +
      "&skip_disambig=1";

    const response =
    await fetch(url);

    if(!response.ok){

      return "";

    }

    const data =
    await response.json();

    if(data.Image){

      if(
        data.Image.startsWith("//")
      ){

        return "https:" + data.Image;

      }

      return data.Image;

    }

    return "";

  }

  catch(error){

    return "";

  }

}

/* ==============================
   WIKIPEDIA
============================== */

async function searchWikipedia(
  title,
  category
){

  try{

    const query =
    imageQuery(
      title,
      category
    );

    const api =
      "https://en.wikipedia.org/w/api.php" +
      "?action=query" +
      "&generator=search" +
      "&gsrsearch=" +
      encodeURIComponent(query) +
      "&gsrlimit=10" +
      "&prop=pageimages" +
      "&piprop=original|thumbnail" +
      "&pithumbsize=900" +
      "&format=json" +
      "&origin=*";

    const response =
    await fetch(api);

    if(!response.ok){

      return "";

    }

    const data =
    await response.json();

    const pages =
    Object.values(
      data?.query?.pages || {}
    );

    if(!pages.length){

      return "";

    }

    const words =
    title
    .toLowerCase()
    .split(/\s+/)
    .filter(
      word=>word.length > 2
    );

    const scored =
    pages
    .map(
      page=>{

        const pageTitle =
        String(
          page.title || ""
        )
        .toLowerCase();

        let score = 0;

        words.forEach(
          word=>{

            if(
              pageTitle.includes(word)
            ){

              score += 5;

            }

          }
        );

        if(
          pageTitle.includes(
            title.toLowerCase()
          )
        ){

          score += 15;

        }

        return {

          score,

          url:
            page.thumbnail?.source ||
            page.original?.source ||
            ""

        };

      }
    )
    .filter(
      result=>result.url
    )
    .sort(
      (a,b)=>
      b.score-a.score
    );

    if(
      scored.length &&
      scored[0].score >= 5
    ){

      return scored[0].url;

    }

    return "";

  }

  catch(error){

    return "";

  }

}

/* ==============================
   OPENVERSE
============================== */

async function searchOpenverse(
  title,
  category
){

  try{

    const query =
    imageQuery(
      title,
      category
    );

    const api =
      "https://api.openverse.org/v1/images/?" +
      "page_size=20&q=" +
      encodeURIComponent(query);

    const response =
    await fetch(api);

    if(!response.ok){

      return "";

    }

    const data =
    await response.json();

    const results =
    Array.isArray(
      data.results
    )
    ? data.results
    : [];

    const words =
    title
    .toLowerCase()
    .split(/\s+/)
    .filter(
      word=>word.length > 2
    );

    const ranked =
    results
    .map(
      result=>{

        const information =
        [
          result.title,
          result.creator,
          result.source,
          result.tags
          ?.map?.(
            tag=>tag.name
          )
          .join(" ")
        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

        let score = 0;

        words.forEach(
          word=>{

            if(
              information.includes(word)
            ){

              score += 4;

            }

          }
        );

        return {

          score,

          url:
            result.thumbnail ||
            result.url ||
            ""

        };

      }
    )
    .filter(
      result=>result.url
    )
    .sort(
      (a,b)=>
      b.score-a.score
    );

    if(
      ranked.length &&
      ranked[0].score >= 4
    ){

      return ranked[0].url;

    }

    return "";

  }

  catch(error){

    return "";

  }

}

/* ==============================
   FLICKR FALLBACK
============================== */

function flickrFallback(
  title,
  category
){

  let query = title;

  if(category === "Want"){

    query =
    `${title},product`;

  }

  if(category === "Go"){

    query =
    `${title},travel`;

  }

  if(category === "Do"){

    query =
    `${title},activity`;

  }

  if(category === "Watch"){

    query =
    `${title},movie`;

  }

  const clean =
  query
  .replace(
    /[^a-zA-Z0-9\s,-]/g,
    ""
  )
  .trim()
  .replace(
    /\s+/g,
    ","
  );

  const lock =
  Math.abs(
    hashString(
      title + category
    )
  );

  return (
    "https://loremflickr.com/900/900/" +
    encodeURIComponent(clean) +
    "?lock=" +
    lock
  );

}

function hashString(text){

  let hash = 0;

  for(
    let i=0;
    i<text.length;
    i++
  ){

    hash =
    (
      (
        hash << 5
      )
      -
      hash
    )
    +
    text.charCodeAt(i);

    hash =
    hash | 0;

  }

  return hash;

}

/* ==============================
   MAIN IMAGE SEARCH
============================== */

async function findImage(
  title,
  category="Want"
){

  const cleanTitle =
  String(
    title || ""
  )
  .trim();

  if(
    cleanTitle.length < 2
  ){

    return "";

  }

  let result = "";

  /*
    1 — DuckDuckGo
  */

  result =
  await searchDuckDuckGo(
    cleanTitle,
    category
  );

  if(result){

    return result;

  }

  /*
    2 — Wikipedia
  */

  result =
  await searchWikipedia(
    cleanTitle,
    category
  );

  if(result){

    return result;

  }

  /*
    3 — Openverse
  */

  result =
  await searchOpenverse(
    cleanTitle,
    category
  );

  if(result){

    return result;

  }

  /*
    4 — Flickr fallback
       This means the card
       will not stay empty.
  */

  return flickrFallback(
    cleanTitle,
    category
  );

}

/* ==============================
   ENSURE IMAGE
============================== */

async function ensureImage(item){

  if(item.image){

    return item.image;

  }

  if(
    searchingImages.has(
      item.id
    )
  ){

    return "";

  }

  searchingImages.add(
    item.id
  );

  const found =
  await findImage(
    item.title,
    item.type
  );

  searchingImages.delete(
    item.id
  );

  if(found){

    item.image =
    found;

    saveItems();

    renderRecent();

    if(
      document
      .getElementById(
        "categoryScreen"
      )
      .classList
      .contains(
        "active"
      )
    ){

      renderItems();

    }

  }

  return found;

}

/* ==============================
   PREVIEW
============================== */

function schedulePreview(){

  clearTimeout(
    previewTimer
  );

  const title =
  document
  .getElementById(
    "itemTitle"
  )
  .value
  .trim();

  if(
    title.length < 3
  ){

    previewImage = "";

    showPreview("");

    return;

  }

  previewTimer =
  setTimeout(
    async()=>{

      const copy =
      document.getElementById(
        "autoCopy"
      );

      copy.textContent =
      "Searching for an image...";

      const category =
      document
      .getElementById(
        "itemCategory"
      )
      .value;

      const found =
      await findImage(
        title,
        category
      );

      previewImage =
      found;

      showPreview(
        found
      );

    },
    700
  );

}

function showPreview(url){

  const image =
  document.getElementById(
    "autoPreview"
  );

  const copy =
  document.getElementById(
    "autoCopy"
  );

  if(url){

    image.src =
    url;

    image
    .classList
    .add(
      "visible"
    );

    copy.textContent =
    "Image found.";

  }

  else{

    image.removeAttribute(
      "src"
    );

    image
    .classList
    .remove(
      "visible"
    );

    copy.textContent =
    "Type a title and Milestone will search for an image.";

  }

}

function manualImagePreview(){

  const value =
  document
  .getElementById(
    "itemImageUrl"
  )
  .value
  .trim();

  if(value){

    previewImage =
    value;

    showPreview(
      value
    );

  }

  else{

    schedulePreview();

  }

}

/* ==============================

============================== */

function updateCounts(){

  [
    "Want",
    "Go",
    "Do",
    "Watch"
  ]
  .forEach(
    category=>{

      const count =
      items.filter(
        item=>
        item.type === category
      )
      .length;

      document
      .getElementById(
        category+"Count"
      )
      .textContent =
      count;

    }
  );

  const completed =
  items.filter(
    item=>item.done
  )
  .length;

  document
  .getElementById(
    "completedCount"
  )
  .textContent =
  completed;

  document
  .getElementById(
    "totalStat"
  )
  .textContent =
  items.length;

  document
  .getElementById(
    "doneStat"
  )
  .textContent =
  completed;

  document
  .getElementById(
    "openStat"
  )
  .textContent =
  items.length -
  completed;

  renderRecent();

}

/* ==============================
   RECENT
============================== */

function renderRecent(){

  const box =
  document
  .getElementById(
    "recentList"
  );

  const recent =
  items.slice(
    0,
    4
  );

  if(
    !recent.length
  ){

    box.innerHTML = `

      <div class="empty">

        Nothing saved yet.
        <br><br>
        Add something you want to remember.

      </div>

    `;

    return;

  }

  box.innerHTML =
  recent
  .map(
    item=>{

      const image =
      item.image

      ? `

        <img
          class="recent-thumb"
          src="${escapeHtml(item.image)}"
          alt="${escapeHtml(item.title)}"
          onerror="
            this.style.display='none';
            this.nextElementSibling.style.display='grid';
          ">

        <div
          class="placeholder"
          style="display:none;">
          ◌
        </div>

      `

      : `

        <div class="placeholder">
        ◌
        </div>

      `;

      return `

        <div class="recent-item">

          ${image}

          <div class="recent-main">

            <div class="recent-title">
              ${escapeHtml(item.title)}
            </div>

            <div class="recent-meta">

              ${
                escapeHtml(
                  categoryNames[item.type] ||
                  item.type
                )
              }

              ${
                item.date
                ? " · " +
                escapeHtml(
                  item.date
                )
                : ""
              }

            </div>

          </div>

          <button
            class="check ${
              item.done
              ? "done"
              : ""
            }"
            onclick="toggleItem(${item.id})">

            ${
              item.done
              ? "✓"
              : ""
            }

          </button>

          <button
            class="delete-btn"
            onclick="deleteItem(${item.id})">

            ⋯

          </button>

        </div>

      `;

    }
  )
  .join("");

  recent
  .filter(
    item=>!item.image
  )
  .forEach(
    item=>ensureImage(item)
  );

}

/* ==============================
   FILTERS
============================== */

function renderFilters(){

  const current =
  labels[
    currentCategory
  ];

  document
  .getElementById(
    "filters"
  )
  .innerHTML = `

    <button
      class="filter ${
        currentFilter === "all"
        ? "active"
        : ""
      }"
      onclick="setFilter('all')">

      All

    </button>

    <button
      class="filter ${
        currentFilter === "open"
        ? "active"
        : ""
      }"
      onclick="setFilter('open')">

      ${current.open}

    </button>

    <button
      class="filter ${
        currentFilter === "done"
        ? "active"
        : ""
      }"
      onclick="setFilter('done')">

      ${current.done}

    </button>

  `;

}

function setFilter(
  filter
){

  currentFilter =
  filter;

  renderFilters();

  renderItems();

}

/* ==============================
   ITEMS
============================== */

function renderItems(){

  let filtered =
  items.filter(
    item=>
    item.type ===
    currentCategory
  );

  if(
    currentFilter ===
    "open"
  ){

    filtered =
    filtered.filter(
      item=>!item.done
    );

  }

  if(
    currentFilter ===
    "done"
  ){

    filtered =
    filtered.filter(
      item=>item.done
    );

  }

  const list =
  document
  .getElementById(
    "itemsList"
  );

  if(
    !filtered.length
  ){

    list.innerHTML = `

      <div class="empty">
        Nothing here yet.
      </div>

    `;

    return;

  }

  list.innerHTML =
  filtered
  .map(
    item=>{

      const image =
      item.image

      ? `

        <img
          class="item-thumb"
          src="${escapeHtml(item.image)}"
          alt="${escapeHtml(item.title)}"
          onerror="
            this.style.display='none';
            this.nextElementSibling.style.display='grid';
          ">

        <div
          class="placeholder"
          style="display:none;">
          ◌
        </div>

      `

      : `

        <div class="placeholder">
        ◌
        </div>

      `;

      return `

        <div class="item">

          ${image}

          <div class="item-main">

            <div class="item-title">
              ${escapeHtml(item.title)}
            </div>

            ${
              item.notes

              ? `

                <div class="item-note">
                  ${escapeHtml(item.notes)}
                </div>

              `

              : ""
            }

          </div>

          <button
            class="check ${
              item.done
              ? "done"
              : ""
            }"
            onclick="toggleItem(${item.id})">

            ${
              item.done
              ? "✓"
              : ""
            }

          </button>

          <button
            class="delete-btn"
            onclick="deleteItem(${item.id})">

            ⋯

          </button>

        </div>

      `;

    }
  )
  .join("");

  filtered
  .filter(
    item=>!item.image
  )
  .forEach(
    item=>ensureImage(item)
  );

}

/* ==============================
   COMPLETE
============================== */

function toggleItem(id){

  const item =
  items.find(
    item=>item.id === id
  );

  if(!item){

    return;

  }

  item.done =
  !item.done;

  saveItems();

  updateCounts();

  if(
    document
    .getElementById(
      "categoryScreen"
    )
    .classList
    .contains(
      "active"
    )
  ){

    renderItems();

  }

}

/* ==============================
   DELETE
============================== */

function deleteItem(id){

  const item =
  items.find(
    item=>item.id === id
  );

  if(!item){

    return;

  }

  const confirmed =
  confirm(
    `Delete "${item.title}"?`
  );

  if(!confirmed){

    return;

  }

  items =
  items.filter(
    item=>item.id !== id
  );

  saveItems();

  updateCounts();

  if(
    document
    .getElementById(
      "categoryScreen"
    )
    .classList
    .contains(
      "active"
    )
  ){

    renderItems();

  }

}

/* ==============================
   ADD
============================== */

async function addItem(){

  const title =
  document
  .getElementById(
    "itemTitle"
  )
  .value
  .trim();

  if(!title){

    return;

  }

  const type =
  document
  .getElementById(
    "itemCategory"
  )
  .value;

  const item = {

    id:
      Date.now(),

    title,

    type,

    done:
      false,

    notes:
      document
      .getElementById(
        "itemNotes"
      )
      .value
      .trim(),

    date:
      document
      .getElementById(
        "itemDate"
      )
      .value,

    link:
      document
      .getElementById(
        "itemLink"
      )
      .value
      .trim(),

    image:
      document
      .getElementById(
        "itemImageUrl"
      )
      .value
      .trim()
      ||
      previewImage
      ||
      ""

  };

  items.unshift(
    item
  );

  saveItems();

  closeModal();

  currentCategory =
  type;

  updateCounts();

  openCategory(
    type
  );

  if(
    !item.image
  ){

    await ensureImage(
      item
    );

  }

}
