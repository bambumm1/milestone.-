<style>

*{
  box-sizing:border-box;
}

:root{

  --bg:#B5A38F;

  --white:#FFFDF8;

  --white-soft:rgba(255,253,248,.72);

  --line:rgba(255,255,255,.82);

  --panel:rgba(255,255,255,.035);

  --panel-strong:rgba(255,255,255,.07);

}

html,
body{

  margin:0;

  min-height:100%;

  background:var(--bg);

  color:var(--white);

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Helvetica Neue",
  Arial,
  sans-serif;

}

button,
input,
select,
textarea{

  font:inherit;

}

button{

  cursor:pointer;

}

.app{

  width:100%;

  max-width:520px;

  min-height:100vh;

  margin:auto;

  padding:
  calc(env(safe-area-inset-top) + 30px)
  22px
  120px;

}

.screen{

  display:none;

}

.screen.active{

  display:block;

}


/* TOP */

.topbar{

  display:flex;

  justify-content:flex-end;

  align-items:center;

  min-height:30px;

}

.icon-button{

  border:0;

  padding:4px;

  background:none;

  color:var(--white);

}


/* HEADER */

.header{

  text-align:center;

  padding-top:18px;

  margin-bottom:42px;

}

.greeting{

  font-family:
  Georgia,
  "Times New Roman",
  serif;

  font-size:26px;

  font-weight:400;

  opacity:.92;

}

.name{

  margin-top:3px;

  font-family:
  Georgia,
  "Times New Roman",
  serif;

  font-size:52px;

  font-weight:400;

  line-height:1;

}

.tagline{

  margin-top:18px;

  font-family:
  Georgia,
  "Times New Roman",
  serif;

  font-size:15px;

  letter-spacing:3px;

  color:var(--white-soft);

}


/* CATEGORY GRID */

.grid{

  display:grid;

  grid-template-columns:
  repeat(2,1fr);

  gap:10px;

}

.category-card{

  position:relative;

  height:170px;

  border:

  1.3px
  solid
  var(--line);

  border-radius:21px;

  background:var(--panel);

  color:var(--white);

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  transition:
  transform .15s ease,
  background .15s ease;

}

.category-card:active{

  transform:scale(.98);

  background:var(--panel-strong);

}

.category-icon{

  height:40px;

  margin-bottom:15px;

  display:flex;

  align-items:center;

  justify-content:center;

}

.category-title{

  font-family:
  Georgia,
  "Times New Roman",
  serif;

  font-size:31px;

  font-weight:400;

}

.category-count{

  margin-top:11px;

  font-family:
  Georgia,
  "Times New Roman",
  serif;

  font-size:14px;

  letter-spacing:1px;

  color:var(--white-soft);

}


/* PROGRESS */

.progress-card{

  margin-top:18px;

  min-height:105px;

  border:

  1.3px
  solid
  var(--line);

  border-radius:21px;

  background:var(--panel);

  display:flex;

  align-items:center;

  padding:19px 21px;

}

.progress-icon{

  width:82px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-right:

  1px
  solid
  rgba(255,255,255,.6);

  margin-right:22px;

  padding-right:22px;

}

.progress-copy{

  flex:1;

  font-family:
  Georgia,
  "Times New Roman",
  serif;

}

.progress-small{

  font-size:14px;

  color:var(--white-soft);

}

.progress-number{

  font-size:25px;

  margin:3px 0;

}

.progress-arrow{

  font-size:29px;

  opacity:.9;

}


/* ACTIVITY */

.section-header{

  margin-top:31px;

  margin-bottom:14px;

  display:flex;

  justify-content:space-between;

  align-items:center;

}

.section-title{

  font-family:
  Georgia,
  "Times New Roman",
  serif;

  font-size:25px;

  font-weight:400;

}

.see-all{

  border:0;

  background:none;

  color:var(--white-soft);

  font-family:
  Georgia,
  "Times New Roman",
  serif;

  font-size:14px;

}

.empty-activity{

  min-height:105px;

  border:

  1.3px
  solid
  var(--line);

  border-radius:21px;

  background:var(--panel);

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  text-align:center;

  color:var(--white-soft);

  font-family:
  Georgia,
  "Times New Roman",
  serif;

}

.empty-main{

  font-size:16px;

}

.empty-sub{

  margin-top:6px;

  font-size:13px;

}


/* ACTIVITY ITEMS */

.activity-item{

  min-height:67px;

  border:

  1px
  solid
  rgba(255,255,255,.55);

  border-radius:17px;

  margin-bottom:8px;

  padding:12px 14px;

  display:flex;

  align-items:center;

  background:rgba(255,255,255,.025);

}

.activity-text{

  flex:1;

}

.activity-title{

  font-family:
  Georgia,
  "Times New Roman",
  serif;

  font-size:17px;

}

.activity-meta{

  color:var(--white-soft);

  font-size:11px;

  margin-top:4px;

}


/* CATEGORY SCREEN */

.category-top{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:32px;

}

.category-top-left{

  display:flex;

  align-items:center;

  gap:14px;

}

.back-button{

  border:0;

  background:none;

  color:white;

  font-size:28px;

  padding:0;

}

.category-screen-title{

  font-family:
  Georgia,
  "Times New Roman",
  serif;

  font-size:35px;

}

.top-actions{

  display:flex;

  align-items:center;

  gap:12px;

/* FILTERS */

.filters{

  gap:8px;

  margin-bottom:24px;

}

.filter{

}

.filter.active{

/* ITEM LIST */

.item{

}

.item-main{

.item-title{

  Georgia,
  "Times New Roman",

  font-size:18px;

}

.item-note{

  font-size:11px;

  color:var(--white-soft);

}

.check{

  width:25px;

  height:25px;

  border-radius:50%;

  border:

  1.3px
  solid
  rgba(255,255,255,.75);

  background:transparent;

  color:var(--bg);

  display:flex;

  align-items:center;

  justify-content:center;

}

.check.done{

  background:var(--white);

  border-color:var(--white);

}


/* BOTTOM NAV */

.bottom-nav{

  position:fixed;

  left:50%;

  bottom:0;

  transform:translateX(-50%);

  width:min(520px,100%);

  height:91px;

  padding:

  10px
  34px

  backdrop-filter:blur(18px);

  border-top:

  1px
  solid
  rgba(255,255,255,.35);

  display:flex;

  justify-content:space-between;

  align-items:center;

  z-index:20;

}

.nav-button{

  border:0;

  background:none;

  color:var(--white);

  font-family:
  Georgia,
  "Times New Roman",
  serif;

.nav-icon{

  margin:auto;

.add-main{

  height:59px;

  1.3px
  solid

  background:transparent;

  color:var(--white);

  font-weight:200;

/* MODAL */

.modal{

  display:none;

  position:fixed;

  inset:0;

  z-index:40;

  rgba(70,55,45,.45);

  align-items:flex-end;

}

.modal.active{

}

.sheet{

  width:min(520px,100%);

  margin:auto;

  background:#B5A38F;

  border-radius:

  28px
  0

  border-top:

  1px
  solid
  rgba(255,255,255,.55);

  25px
  22px
  calc(30px + env(safe-area-inset-bottom));

}

.sheet-header{

  display:flex;

  justify-content:space-between;

  align-items:center;

}

.sheet-title{

  font-family:
  Georgia,
  "Times New Roman",
  serif;

  font-size:25px;

.text-button{

  border:0;

  background:none;

}

.field{

  margin-bottom:16px;

}

.label{

  margin-bottom:7px;

  font-size:11px;

}

input,
select,
textarea{

  1px

  rgba(255,255,255,.55);

  background:
  rgba(255,255,255,.06);

  padding:14px;

.save-button{

/* EMPTY */

.empty{

  padding:40px 0;

  text-align:center;

  color:var(--white-soft);

  font-family:
  Georgia,
  "Times New Roman",
  serif;

}

</style>
</head>

<script>


let items =
JSON.parse(
  localStorage.getItem("milestones")
) || [];


items =
items.map(
  (i,n)=>({

    id:
    i.id ||
    Date.now()+n,

    title:
    i.title ||
    "Untitled",

    type:
    i.type ||
    i.category ||
    "Want",

    done:
    Boolean(
      i.done ||
      i.completed
    ),

    notes:
    i.notes || "",

    date:
    i.date || "",

    link:
    i.link || ""

  })
);


let currentCategory =
"Want";


let currentFilter =
"all";


const categoryLabels = {

  Want:{
    open:"To Buy",
    done:"Bought"
  },

  Go:{
    open:"To Go",
    done:"Visited"
  },

  Do:{
    open:"To Do",
    done:"Done"
  },

  Watch:{
    open:"To Watch",
    done:"Watched"
  }

};


function saveItems(){

  localStorage.setItem(
    "milestones",
    JSON.stringify(items)
  );

}


function escapeHtml(text){

  return String(text)
  .replace(
    /[&<>"']/g,
    m=>({

      "&":"&amp;",

      "<":"&lt;",

      ">":"&gt;",

      '"':"&quot;",

      "'":"&#039;"

    }[m])
  );

}


function updateGreeting(){

  const hour =
  new Date().getHours();


  let text =
  "Good evening,";


  if(hour < 12){

    text =
    "Good morning,";

  }

  else if(hour < 18){

    text =
    "Good afternoon,";

  }


  document
  .getElementById("greeting")
  .textContent =
  text;

}


function updateCounts(){

  [
    "Want",
    "Go",
    "Do",
    "Watch"
  ].forEach(
    category=>{

      const count =
      items.filter(
        item=>
        item.type === category
      ).length;


      document
      .getElementById(
        category+"Count"
      )
      .textContent =
      count;

    }
  );


  const completed =
  items.filter(
    i=>i.done
  ).length;


  document
  .getElementById(
    "completedCount"
  )
  .textContent =
  completed;


  document
  .getElementById(
    "totalStat"
  )
  .textContent =
  items.length;


  document
  .getElementById(
    "doneStat"
  )
  .textContent =
  completed;


  document
  .getElementById(
    "openStat"
  )
  .textContent =
  items.length - completed;


  renderRecent();

}


function renderRecent(){

  const box =
  document.getElementById(
    "recentList"
  );


  const recent =
  items.slice(0,4);


  if(!recent.length){

    box.innerHTML = `

      <div class="empty-activity">

        <div class="empty-main">

          No recent activity yet.

        </div>

        <div class="empty-sub">

          Add a milestone to get started.

        </div>

      </div>

    `;

    return;

  }


  box.innerHTML =
  recent.map(
    item=>`

      <div class="activity-item">

        <div class="activity-text">

          <div class="activity-title">

            ${escapeHtml(item.title)}

          </div>

          <div class="activity-meta">

            ${
              item.done
              ? "Completed"
              : "Added"
            }

            ${
              item.date
              ? " · "+item.date
              : ""
            }

          </div>

        </div>

        <button
          class="check ${
            item.done
            ? "done"
            : ""
          }"
          onclick="toggleItem(${item.id})"
        >

          ${
            item.done
            ? "✓"
            : ""
          }

        </button>

      </div>

    `
  ).join("");

}


function switchScreen(id){

  document
  .querySelectorAll(".screen")
  .forEach(
    screen=>
    screen.classList.remove(
      "active"
    )
  );


  document
  .getElementById(id)
  .classList.add(
    "active"
  );


  window.scrollTo(
    0,
    0
  );

}


function goHome(){

  switchScreen(
    "homeScreen"
  );


  updateCounts();

}


function openProfile(){

  updateCounts();


  switchScreen(
    "profileScreen"
  );

}


function openCategory(category){

  currentCategory =
  category;


  currentFilter =
  "all";


  document
  .getElementById(
    "categoryTitle"
  )
  .textContent =
  category;


  renderFilters();


  renderItems();


  switchScreen(
    "categoryScreen"
  );

}


function renderFilters(){

  const labels =
  categoryLabels[
    currentCategory
  ];


  document
  .getElementById(
    "filters"
  )
  .innerHTML = `

    <button
      class="filter ${
        currentFilter==="all"
        ? "active"
        : ""
      }"
      onclick="setFilter('all')"
    >
      All
    </button>


    <button
      class="filter ${
        currentFilter==="open"
        ? "active"
        : ""
      }"
      onclick="setFilter('open')"
    >
      ${labels.open}
    </button>


    <button
      class="filter ${
        currentFilter==="done"
        ? "active"
        : ""
      }"
      onclick="setFilter('done')"
    >
      ${labels.done}
    </button>

  `;

}


function setFilter(filter){

  currentFilter =
  filter;


  renderFilters();


  renderItems();

}


function renderItems(){

  let filtered =
  items.filter(
    item=>
    item.type === currentCategory
  );


  if(
    currentFilter === "open"
  ){

    filtered =
    filtered.filter(
      i=>!i.done
    );

  }


  if(
    currentFilter === "done"
  ){

    filtered =
    filtered.filter(
      i=>i.done
    );

  }


  const list =
  document.getElementById(
    "itemsList"
  );


  if(!filtered.length){

    list.innerHTML = `

      <div class="empty">

        Nothing here yet.

      </div>

    `;

    return;

  }


  list.innerHTML =
  filtered.map(
    item=>`

      <div class="item">

        <div class="item-main">

          <div class="item-title">

            ${escapeHtml(item.title)}

          </div>

          ${
            item.notes
            ? `

            <div class="item-note">

              ${escapeHtml(item.notes)}

            </div>

            `
            : ""
          }

        </div>


        <button
          class="check ${
            item.done
            ? "done"
            : ""
          }"
          onclick="toggleItem(${item.id})"
        >

          ${
            item.done
            ? "✓"
            : ""
          }

        </button>


      </div>

    `
  ).join("");

}


function toggleItem(id){

  const item =
  items.find(
    i=>i.id===id
  );


  if(!item){
    return;
  }


  item.done =
  !item.done;


  saveItems();


  updateCounts();


  renderItems();

}


function openModal(){

  document
  .getElementById(
    "modal"
  )
  .classList.add(
    "active"
  );


  document
  .getElementById(
    "itemCategory"
  )
  .value =
  currentCategory;

}


function closeModal(){

  document
  .getElementById(
    "modal"
  )
  .classList.remove(
    "active"
  );

}


function addItem(){

  const title =
  document
  .getElementById(
    "itemTitle"
  )
  .value
  .trim();


  const type =
  document
  .getElementById(
    "itemCategory"
  )
  .value;


  const notes =
  document
  .getElementById(
    "itemNotes"
  )
  .value
  .trim();


  const date =
  document
  .getElementById(
    "itemDate"
  )
  .value;


  if(!title){
    return;
  }


  items.unshift({

    id:
    Date.now(),

    title,

    type,

    done:
    false,

    notes,

    date,

    link:""

  });


  saveItems();


  document
  .getElementById(
    "itemTitle"
  )
  .value =
  "";


  document
  .getElementById(
    "itemNotes"
  )
  .value =
  "";


  document
  .getElementById(
    "itemDate"
  )
  .value =
  "";


  closeModal();


  currentCategory =
  type;


  updateCounts();


  openCategory(
    type
  );

}


saveItems();

updateGreeting();

updateCounts();


</script>


</body>
</html>
