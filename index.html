<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F1EB">
<title>Milestone</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Milestone">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#F4F1EB;
  --ink:#111;
  --muted:#77736d;
  --soft:#EAE6DF;
  --line:#DED9D1;
}

html,
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

button{
  font:inherit;
  color:inherit;
  cursor:pointer;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding:calc(env(safe-area-inset-top) + 26px) 20px 112px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.icon{
  border:0;
  background:none;
  padding:3px;
  font-size:23px;
  line-height:1;
}

.greeting{
  font:400 20px Georgia,serif;
  margin-top:16px;
}

.name{
  font:400 37px/1 Georgia,serif;
  margin:5px 0 12px;
}

.tag{
  font-size:14px;
  color:#6f6b66;
  margin-bottom:24px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.card{
  height:177px;
  border:0;
  border-radius:12px;
  overflow:hidden;
  position:relative;
  padding:0;
  background:#111;
  color:#fff;
  text-align:left;
}

.card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.card:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(0,0,0,.76),
    rgba(0,0,0,.05) 72%
  );
}

.cardcopy{
  position:absolute;
  z-index:2;
  left:14px;
  bottom:13px;
}

.cardname{
  font:400 27px Georgia,serif;
}

.count{
  font-size:12px;
  margin-top:3px;
}

.progress{
  margin-top:18px;
  border-radius:13px;
  background:#E9E5DE;
  padding:17px 18px;
  display:flex;
  align-items:center;
  gap:17px;
}

.bars{
  font-size:29px;
  letter-spacing:-4px;
}

.progresscopy{
  flex:1;
  font-size:12px;
  line-height:1.35;
}

.progresscopy b{
  font-size:14px;
}

.arrow{
  font-size:22px;
}

.section{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin:26px 0 10px;
}

.section h2{
  font:400 21px Georgia,serif;
  margin:0;
}

.section button{
  border:0;
  background:none;
  color:var(--muted);
}

.activity{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.activityrow{
  background:#E9E5DE;
  border-radius:10px;
  padding:7px;
  display:flex;
  align-items:center;
  gap:10px;
}

.activityrow img{
  width:48px;
  height:48px;
  border-radius:8px;
  object-fit:cover;
}

.activitytext{
  flex:1;
  min-width:0;
}

.activitytitle{
  font:400 15px Georgia,serif;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.meta{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.circle{
  width:22px;
  height:22px;
  border-radius:50%;
  border:1px solid #9d9993;
  display:grid;
  place-items:center;
  flex:none;
}

.circle.done{
  background:#0c0c0c;
  color:#fff;
  border-color:#0c0c0c;
  font-size:12px;
}

.catbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:10px 0 22px;
}

.catleft{
  display:flex;
  align-items:center;
  gap:12px;
}

.back{
  border:0;
  background:none;
  font-size:25px;
  padding:0;
}

.caticon{
  font-size:27px;
}

.cattitle{
  font:400 29px Georgia,serif;
}

.actions{
  display:flex;
  gap:13px;
}

.filters{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:17px;
}

.filter{
  border:0;
  border-radius:999px;
  background:#E7E3DC;
  padding:10px 8px;
  font-size:12px;
}

.filter.active{
  background:#0c0c0c;
  color:#fff;
}

.item{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:62px;
}

.thumb{
  width:52px;
  height:52px;
  border-radius:8px;
  object-fit:cover;
  background:#ddd;
}

.itemtitle{
  font-size:13px;
  flex:1;
}

.itemtap{
  display:flex;
  align-items:center;
  gap:12px;
  flex:1;
  min-width:0;
}

.bottom{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(520px,100%);
  height:88px;
  padding:10px 32px calc(14px + env(safe-area-inset-bottom));
  background:rgba(244,241,235,.96);
  backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:20;
}

.nav{
  border:0;
  background:none;
  font-size:11px;
  min-width:52px;
}

.navsym{
  font-size:21px;
  display:block;
  margin-bottom:3px;
}

.plus{
  width:55px;
  height:55px;
  border-radius:50%;
  border:0;
  background:#050505;
  color:#fff;
  font-size:31px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  z-index:30;
  align-items:flex-end;
}

.modal.active{
  display:flex;
}

.sheet{
  width:min(520px,100%);
  margin:auto;
  background:var(--bg);
  border-radius:22px 22px 0 0;
  padding:22px 20px calc(26px + env(safe-area-inset-bottom));
}

.sheethead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.sheethead b{
  font-family:Georgia,serif;
  font-size:21px;
  font-weight:400;
}

.textbtn{
  border:0;
  background:none;
}

label{
  display:block;
  font-size:11px;
  margin:10px 0 5px;
  color:var(--muted);
}

input,
select{
  width:100%;
  border:1px solid var(--line);
  background:#FAF8F4;
  border-radius:9px;
  padding:12px;
  font:inherit;
}

.save{
  width:100%;
  border:0;
  border-radius:10px;
  background:#111;
  color:white;
  padding:14px;
  margin-top:17px;
}

.empty{
  font-size:12px;
  color:#999;
  padding:18px 4px;
}
</style>
</head>

<body>

<div class="app">

<section id="home" class="screen active">

  <div class="top">
    <span></span>
    <button
      class="icon"
      onclick="alert('Profile comes after Home + Want approval')"
    >
      ⚙︎
    </button>
  </div>

  <div id="greeting" class="greeting">
    Good morning,
  </div>

  <div class="name">
    Batu.
  </div>

  <div class="tag">
    “A more intentional you.”
  </div>

  <div id="grid" class="grid"></div>

  <div class="progress">

    <div class="bars">
      ▂▅▇
    </div>

    <div class="progresscopy">
      You've completed
      <br>

      <b>
        <span id="doneCount">0</span>
        milestones
      </b>

      <br>

      <span style="color:var(--muted)">
        Keep going.
      </span>
    </div>

    <div class="arrow">
      ›
    </div>

  </div>

  <div class="section">

    <h2>
      Recent Activity
    </h2>

    <button>
      See All
    </button>

  </div>

  <div
    id="activity"
    class="activity"
  ></div>

</section>

<section id="want" class="screen">

  <div class="catbar">

    <div class="catleft">

      <button
        class="back"
        onclick="home()"
      >
        ←
      </button>

      <span class="caticon">
        ♧
      </span>

      <span class="cattitle">
        Want
      </span>

    </div>

    <div class="actions">

      <button
        class="icon"
        onclick="openAdd()"
      >
        ＋
      </button>

      <button class="icon">
        ···
      </button>

    </div>

  </div>

  <div class="filters">

    <button
      class="filter active"
      onclick="filterWant('all',this)"
    >
      All
    </button>

    <button
      class="filter"
      onclick="filterWant('open',this)"
    >
      To Buy
    </button>

    <button
      class="filter"
      onclick="filterWant('done',this)"
    >
      Bought
    </button>

  </div>

  <div id="wantList"></div>

</section>

</div>

<nav class="bottom">

  <button
    class="nav"
    onclick="home()"
  >
    <span class="navsym">
      ⌂
    </span>
    Home
  </button>

  <button
    class="plus"
    onclick="openAdd()"
  >
    +
  </button>

  <button
    class="nav"
    onclick="alert('Profile comes next')"
  >
    <span class="navsym">
      ♙
    </span>
    Profile
  </button>

</nav>

<div
  class="modal"
  id="modal"
>

  <div class="sheet">

    <div class="sheethead">

      <button
        class="textbtn"
        onclick="closeAdd()"
      >
        Cancel
      </button>

      <b>
        Add milestone
      </b>

      <span></span>

    </div>

    <label>
      Title
    </label>

    <input
      id="title"
      placeholder="e.g. New Balance 9060"
    >

    <label>
      Category
    </label>

    <select id="type">

      <option>
        Want
      </option>

      <option>
        Go
      </option>

      <option>
        Do
      </option>

      <option>
        Watch
      </option>

    </select>

    <button
      class="save"
      onclick="add()"
    >
      Add
    </button>

  </div>

</div>

<script>

const cats = {

  Want:{
    fallback:
    "https://images.unsplash.com/photo-1523779917675-b6ed3a42a561?auto=format&fit=crop&w=900&q=80"
  },

  Go:{
    fallback:
    "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80"
  },

  Do:{
    fallback:
    "https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=900&q=80"
  },

  Watch:{
    fallback:
    "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=900&q=80"
  }

};

let items =
JSON.parse(
  localStorage.getItem("milestones") || "[]"
).map((i,n)=>({

  id:
  i.id || Date.now()+n,

  title:
  i.title || "Untitled",

  type:
  i.type || i.category || "Want",

  done:
  Boolean(i.done || i.completed),

  notes:
  i.notes || "",

  date:
  i.date || "",

  link:
  i.link || "",

  image:
  i.image || ""

}));

let wf = "all";

save();

function save(){

  localStorage.setItem(
    "milestones",
    JSON.stringify(items)
  );

}

function esc(s=""){

  return String(s).replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}

function img(i){

  return (
    i.image ||
    cats[i.type]?.fallback ||
    cats.Want.fallback
  );

}

async function fetchImage(i){

  if(i.image){
    return;
  }

  try{

    let r =
    await fetch(
      "https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch="
      + encodeURIComponent(i.title)
      + "&gsrlimit=1&prop=pageimages&piprop=original&format=json&origin=*"
    );

    let d =
    await r.json();

    let p =
    d.query?.pages
    ? Object.values(d.query.pages)[0]
    : null;

    if(p?.original?.source){

      i.image =
      p.original.source;

      save();

      render();

    }

  }catch(e){}

}

function render(){

  let names =
  [
    "Want",
    "Go",
    "Do",
    "Watch"
  ];

  document
  .getElementById("grid")
  .innerHTML =
  names.map(t=>{

    let a =
    items.filter(
      i=>i.type===t
    );

    let cover =
    a.find(
      i=>i.image
    )?.image ||
    cats[t].fallback;

    return `
      <button
        class="card"
        onclick="${
          t==="Want"
          ? "openWant()"
          : "alert('"+t+" comes after Home + Want approval')"
        }"
      >

        <img
          src="${esc(cover)}"
        >

        <div class="cardcopy">

          <div class="cardname">
            ${t}
          </div>

          <div class="count">
            ${a.length} items
          </div>

        </div>

      </button>
    `;

  }).join("");

  let done =
  items.filter(
    i=>i.done
  );

  document
  .getElementById("doneCount")
  .textContent =
  done.length;

  let recent =
  items.slice(0,4);

  document
  .getElementById("activity")
  .innerHTML =
  recent.length

  ? recent.map(i=>`

      <div class="activityrow">

        <img
          src="${esc(img(i))}"
        >

        <div class="activitytext">

          <div class="activitytitle">
            ${esc(i.title)}
          </div>

          <div class="meta">
            ${
              i.done
              ? "Completed"
              : "Added"
            }

            ${
              i.date
              ? " · "+i.date
              : ""
            }
          </div>

        </div>

        <div
          class="circle ${
            i.done
            ? "done"
            : ""
          }"
        >
          ${
            i.done
            ? "✓"
            : ""
          }
        </div>

      </div>

    `).join("")

  : `
    <div class="empty">
      Your latest milestones will appear here.
    </div>
  `;

  renderWant();

  items
  .filter(i=>!i.image)
  .slice(0,4)
  .forEach(fetchImage);

}

function renderWant(){

  let a =
  items.filter(
    i=>i.type==="Want"
  );

  if(wf==="open"){

    a =
    a.filter(
      i=>!i.done
    );

  }

  if(wf==="done"){

    a =
    a.filter(
      i=>i.done
    );

  }

  document
  .getElementById("wantList")
  .innerHTML =

  a.length

  ? a.map(i=>`

      <div class="item">

        <div class="itemtap">

          <img
            class="thumb"
            src="${esc(img(i))}"
          >

          <div class="itemtitle">
            ${esc(i.title)}
          </div>

        </div>

        <button
          class="circle ${
            i.done
            ? "done"
            : ""
          }"
          onclick="toggle(${i.id})"
        >
          ${
            i.done
            ? "✓"
            : ""
          }
        </button>

      </div>

    `).join("")

  : `
    <div class="empty">
      Nothing here yet.
    </div>
  `;

  a
  .filter(i=>!i.image)
  .slice(0,5)
  .forEach(fetchImage);

}

function openWant(){

  document
  .querySelectorAll(".screen")
  .forEach(
    s=>s.classList.remove("active")
  );

  document
  .getElementById("want")
  .classList.add("active");

  renderWant();

  scrollTo(0,0);

}

function home(){

  document
  .querySelectorAll(".screen")
  .forEach(
    s=>s.classList.remove("active")
  );

  document
  .getElementById("home")
  .classList.add("active");

  render();

  scrollTo(0,0);

}

function filterWant(f,b){

  wf=f;

  document
  .querySelectorAll(".filter")
  .forEach(
    x=>x.classList.remove("active")
  );

  b.classList.add("active");

  renderWant();

}

function toggle(id){

  let i =
  items.find(
    x=>x.id===id
  );

  if(i){

    i.done =
    !i.done;

    save();

    render();

  }

}

function openAdd(){

  document
  .getElementById("modal")
  .classList
  .add("active");

}

function closeAdd(){

  document
  .getElementById("modal")
  .classList
  .remove("active");

}

function add(){

  let t =
  document
  .getElementById("title")
  .value
  .trim();

  let type =
  document
  .getElementById("type")
  .value;

  if(!t){
    return;
  }

  let i = {

    id:
    Date.now(),

    title:
    t,

    type:
    type,

    done:
    false,

    notes:
    "",

    date:
    "",

    link:
    "",

    image:
    ""

  };

  items.unshift(i);

  save();

  document
  .getElementById("title")
  .value="";

  closeAdd();

  render();

  fetchImage(i);

  if(type==="Want"){
    openWant();
  }

}

let h =
new Date().getHours();

document
.getElementById("greeting")
.textContent =
h<12
? "Good morning,"
: h<18
? "Good afternoon,"
: "Good evening,";

render();

</script>

</body>
</html>
